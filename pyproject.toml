[project]
name = "asthma-rag"
version = "0.1.0"
description = "Agentic RAG over asthma clinical guidelines with local embeddings, Groq LLM, Cohere reranker, and Gradio UI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.28.2",
    "langchain>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-groq>=0.2.0",
    "transformers>=4.51.0",
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
    "cohere>=5.13.0",
    "groq>=0.11.0",
    "langgraph>=0.2.0",
    "gradio>=5.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asthma_rag"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
